<style>
/* Layout: app shell — sticky top bar, category rail on the left, card grid of guides on the right. */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --surface-2: #eceef5; --line: #dadeea;
  --fg: #161a26; --muted: #4d5568; --accent: #4b4fd8; --accent-soft: #e4e5fd; --on-accent: #ffffff;
  --star: #c98a00; --danger: #c8342b;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgb(20 24 40 / .06), 0 8px 24px -12px rgb(20 24 40 / .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1118; --surface: #161a24; --surface-2: #1d2230; --line: #272d3d;
  --fg: #e7e9f0; --muted: #9ba3b8; --accent: #9097ff; --accent-soft: #252a4d; --on-accent: #0e1118;
  --star: #f2b84b; --danger: #ff7a6e; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1118; --surface: #161a24; --surface-2: #1d2230; --line: #272d3d;
  --fg: #e7e9f0; --muted: #9ba3b8; --accent: #9097ff; --accent-soft: #252a4d; --on-accent: #0e1118;
  --star: #f2b84b; --danger: #ff7a6e; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { font: 800 22px/1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.brand h1 b { color: var(--accent); }
.brand small { font: 400 11px var(--f-mono); color: var(--muted); }
.search { flex: 1; position: relative; max-width: 620px; }
.search input { width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); padding: 0 44px 0 40px; font: 500 15px var(--f-body); }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 14px; top: 12px; color: var(--muted); }
.search kbd { position: absolute; right: 12px; top: 10px; font: 500 11px var(--f-mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface-2); }
.icon-btn { height: 40px; min-width: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
.rail { position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto; padding: 16px 12px 40px 20px;
  border-right: 1px solid var(--line); scrollbar-width: thin; }
.rail-group + .rail-group { margin-top: 14px; }
.rail-group h3 { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  margin: 0 0 6px 10px; }
.cat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.cat:hover { background: var(--surface-2); }
.cat .em { width: 18px; text-align: center; font-size: 14px; }
.cat .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .ct { font: 400 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat[aria-pressed="true"] .ct { color: var(--accent); }

main { padding: 20px 24px 60px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
.head h2 { font: 800 clamp(26px, 3.4vw, 38px)/1.05 var(--f-display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.head p b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 0 10px; font: 500 13px var(--f-body); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); }
.chip .n { font: 400 11px var(--f-mono); color: var(--muted); }
.icon-btn:active { transform: scale(.88); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.active .chip { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.related { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 18px; }
.related .chip { font-size: 12px; padding: 2px 10px; }


/* juice */
.progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 60; transition: width .08s linear; pointer-events: none; }
.totop { position: fixed; right: 18px; bottom: 18px; z-index: 25; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 18px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; }
.totop.show { opacity: 1; transform: none; }
.totop:hover { border-color: var(--accent); color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 70; transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.top { transition: padding .2s, box-shadow .2s; }
body.scrolled .top { box-shadow: 0 6px 20px -14px rgb(0 0 0 / .5); }
body.scrolled .top-in { padding-top: 8px; padding-bottom: 8px; }
.top-in { transition: padding .2s; }
.live { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 40; max-height: 60vh; overflow-y: auto; animation: rise .16s ease; }
.live .hit, #paletteList .hit { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 14px; }
.live .hit .ty, #paletteList .hit .ty { font: 500 10px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 62px; flex: none; }
.live .hit .sub, #paletteList .hit .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.live .hit .lb, #paletteList .hit .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live .hit.sel, #paletteList .hit.sel, .live .hit:hover, #paletteList .hit:hover { background: var(--accent-soft); color: var(--accent); }
.palette-wrap { position: fixed; inset: 0; z-index: 80; background: rgb(8 10 16 / .5); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; animation: fade .15s ease; }
.palette { width: min(620px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; animation: rise .2s cubic-bezier(.2, .8, .2, 1); }
.palette input { width: 100%; height: 46px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font-size: 16px; padding: 0 12px; outline: none; }
#paletteList { max-height: 50vh; overflow-y: auto; margin-top: 6px; }
.phint { margin: 8px 6px 2px; font-size: 12px; color: var(--muted); }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fade { from { opacity: 0; } }
/* topics rows */
.tspotwrap { margin: 0 0 6px; }
.tspot .hbg { filter: blur(30px) saturate(1.4) brightness(.5); }
.tspot::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, hsl(var(--h) 70% 40% / .35), transparent 60%); }
.tspot .hslide .hopen { border: 0; }
.trising { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; }
.trising .lbl { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-right: 2px; }
.trising button { all: unset; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.trising button b { color: var(--accent); margin-left: 4px; font-family: var(--f-mono); font-size: 12px; }
.trising button:hover { border-color: var(--accent); }
.trowwrap { position: relative; }
.trow { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 12px; scrollbar-width: thin; scroll-padding: 0 2px; }
.tcard { all: unset; cursor: pointer; box-sizing: border-box; flex: 0 0 min(260px, 78%); scroll-snap-align: start; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: transform .18s, border-color .18s, box-shadow .18s; }
.tcard:hover { transform: translateY(-3px); border-color: hsl(var(--h) 70% 62% / .75); box-shadow: 0 12px 32px rgb(0 0 0 / .35); }
.tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tcv { position: relative; display: block; height: 150px; overflow: hidden; background: radial-gradient(120% 120% at 15% 10%, hsl(var(--h) 65% 42% / .55), hsl(var(--h) 55% 18% / .9) 70%), var(--surface-2); }
.tbig { position: absolute; right: -14px; bottom: -22px; color: hsl(var(--h) 80% 75%); opacity: .16; transform: rotate(-10deg); }
.fan { position: absolute; width: 46%; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 22px rgb(0 0 0 / .5); border: 2px solid rgb(255 255 255 / .85); background: var(--surface-2); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.fan img { width: 100%; height: 100%; object-fit: cover; display: block; } .fan .ph { padding: 0; } .fan .ph span { display: none; }
.fan.f1 { left: 6%; top: 30px; transform: rotate(-8deg); z-index: 1; }
.fan.f2 { left: 27%; top: 16px; transform: rotate(1deg); z-index: 3; }
.fan.f3 { right: 6%; top: 34px; transform: rotate(8deg); z-index: 2; }
.tcard:hover .f1 { transform: rotate(-12deg) translateX(-4px); } .tcard:hover .f3 { transform: rotate(12deg) translateX(4px); } .tcard:hover .f2 { transform: rotate(0deg) translateY(-4px); }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 5; font: 700 11px var(--f-mono); background: var(--accent); color: var(--on-accent); padding: 2px 8px; border-radius: 999px; }
.tcard .thead { display: flex; align-items: center; gap: 10px; padding: 11px 14px 12px; font-weight: 700; }
.tcard .tic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; color: hsl(var(--h) 75% 66%); background: hsl(var(--h) 70% 60% / .14); }
.tcard .tnm { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.25; }
.tcard .tct { font: 500 12px var(--f-mono); color: var(--muted); }
.trnav { all: unset; cursor: pointer; position: absolute; top: 75px; translate: 0 -50%; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 400 26px/1 var(--f-body); color: #fff; background: rgb(0 0 0 / .55); border: 1px solid rgb(255 255 255 / .15); opacity: 0; transition: opacity .2s; z-index: 6; }
.trnav.prev { left: -8px; } .trnav.next { right: -8px; }
.trowwrap:hover .trnav, .trnav:focus-visible { opacity: 1; } .trnav:hover { background: rgb(0 0 0 / .8); }
@media (hover: none) { .trnav { display: none; } }
/* hero carousel */
.hbanner { position: relative; height: clamp(300px, 28vw, 360px); border-radius: 16px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); isolation: isolate; }
.hslide { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 40%); grid-template-rows: minmax(0, 1fr); align-items: center; gap: 28px; padding: 24px 34px 50px; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility .7s; }
.hslide.on { opacity: 1; visibility: visible; }
.hbg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.3) brightness(.55); transform: scale(1.1); z-index: -2; }
.hslide.on .hbg { animation: hbg 9s ease-out both; }
.hslide::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgb(10 12 20 / .75), rgb(10 12 20 / .25) 70%, transparent); }
.hbody { color: #fff; min-width: 0; max-height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: 9px; }
.hslide.on .hbody { animation: hrise .7s cubic-bezier(.2, .8, .2, 1) both; }
.hkick { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: #c9ccff; }
.hero .hbody h2 { margin: 0; font: 800 clamp(22px, 3vw, 34px)/1.12 var(--f-display); letter-spacing: -.02em; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #fff; text-transform: none; }
.hbody p { margin: 0; font-size: 14.5px; line-height: 1.5; color: rgb(255 255 255 / .82); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 52ch; }
.hmeta { font-size: 13px; color: rgb(255 255 255 / .75); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hmeta span { background: rgb(255 255 255 / .14); border-radius: 5px; padding: 1px 8px; }
.hbtns { display: flex; gap: 10px; margin-top: 4px; }
.hgo, .hopen { all: unset; cursor: pointer; box-sizing: border-box; padding: 9px 20px; border-radius: 8px; font: 700 14px var(--f-body); }
.hgo { background: #fff; color: #12141f; } .hgo:hover { background: #e7e8ff; }
.hopen { background: rgb(255 255 255 / .18); color: #fff; backdrop-filter: blur(6px); } .hopen:hover { background: rgb(255 255 255 / .28); }
.hgo:focus-visible, .hopen:focus-visible, .hnav:focus-visible, .hdots button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.himg { width: min(100%, 440px); height: auto; max-height: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; box-shadow: 0 18px 50px rgb(0 0 0 / .55); justify-self: end; min-height: 0; }
.hslide.on .himg { animation: hpop .8s cubic-bezier(.2, .8, .2, 1) both; }
.hslide.noimg .himg { display: none; }
.hnav { all: unset; cursor: pointer; position: absolute; top: 50%; translate: 0 -50%; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 400 26px/1 var(--f-body); color: #fff; background: rgb(0 0 0 / .35); opacity: 0; transition: opacity .2s, background .2s; z-index: 3; }
.hnav.prev { left: 10px; } .hnav.next { right: 10px; }
.hbanner:hover .hnav, .hnav:focus-visible { opacity: 1; } .hnav:hover { background: rgb(0 0 0 / .6); }
.hdots { position: absolute; left: 34px; bottom: 16px; display: flex; gap: 8px; z-index: 3; }
.hdots button { all: unset; cursor: pointer; width: 26px; height: 4px; border-radius: 4px; background: rgb(255 255 255 / .3); position: relative; overflow: hidden; }
.hdots button.on { background: rgb(255 255 255 / .35); }
.hdots button.on::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; animation: hprog 7s linear both; }
@keyframes hprog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hbg { from { transform: scale(1.1); } to { transform: scale(1.2); } }
@keyframes hrise { from { opacity: 0; transform: translateY(14px); } }
@keyframes hpop { from { opacity: 0; transform: translateX(26px) scale(.96); } }
@media (max-width: 760px) { .hslide { grid-template-columns: minmax(0, 1fr); padding: 20px 20px 46px; } .himg { display: none; } .hbanner { height: 300px; } .hbody p { -webkit-line-clamp: 2; } .hdots { left: 20px; } }
@media (prefers-reduced-motion: reduce) { .hslide, .hslide.on .hbg, .hslide.on .hbody, .hslide.on .himg, .hdots button.on::after { animation: none !important; transition: none !important; } }
.hero { margin: 0 0 22px; }
.hero h2 { font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
.hero .strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 300px); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.hero .strip button { all: unset; box-sizing: border-box; cursor: pointer; scroll-snap-align: start; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); animation: rise .35s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
.hero .strip button:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.hero .strip button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero .strip .rt { width: 76px; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; position: relative; background: var(--surface-2); }
.hero .strip .rt img, .hero .strip .rt .ph { width: 100%; height: 100%; object-fit: cover; }
.hero .strip b { font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero .strip small { color: var(--muted); font-size: 12px; }
.hovercard { position: fixed; z-index: 50; width: 320px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; pointer-events: none; animation: fade .15s ease; }
.hovercard b { display: block; font-size: 14px; margin-bottom: 4px; }
.hovercard p { margin: 0 0 6px; font-size: 13px; line-height: 1.45; }
.hovercard small { color: var(--muted); font: 400 11.5px var(--f-mono); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.empty .ico { font-size: 34px; display: block; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
.empty .btn { display: inline-block; margin-top: 12px; padding: 7px 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent); border: 0; cursor: pointer; font-weight: 600; }
@keyframes float { 50% { transform: translateY(-5px); } }
.tabs { position: relative; }
.tabs button { position: relative; z-index: 1; background: none !important; box-shadow: none !important; }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabpill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .12); transition: transform .25s cubic-bezier(.2, .8, .2, 1), width .25s cubic-bezier(.2, .8, .2, 1); z-index: 0; }
.cat { transition: background .15s, color .15s; }
.pulse { animation: pulse .6s ease; }
@keyframes pulse { 40% { transform: scale(1.12); color: var(--star); } }
.copyrow { position: relative; }
.copybtn { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.copybtn:hover { border-color: var(--accent); color: var(--accent); }
html.theme-vt::view-transition-old(root), html.theme-vt::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
@media (prefers-reduced-motion: reduce) { .progress, .totop, .toast { transition: none !important; } }

/* motion */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { 40% { transform: scale(1.35); } }
.enter { animation: rise .32s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 24ms); }
body.vt .enter { animation: none; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .16s; }
.thumb img { transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
.card:hover .thumb img { transform: scale(1.045); }
.star.pop svg { animation: pop .38s ease; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease, border-color .15s; position: relative; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow), 0 12px 32px -16px color-mix(in srgb, var(--accent) 55%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.thumb { aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--surface-2) 60%, var(--surface)) 50%, var(--surface-2) 70%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; position: relative; overflow: hidden; display: block; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: absolute; inset: 0; display: flex; align-items: end; padding: 10px 12px; }
.ph span { font: 500 11px var(--f-mono); color: #fff; background: rgb(0 0 0 / .35); padding: 2px 8px; border-radius: 4px;
  backdrop-filter: blur(4px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src { position: absolute; top: 8px; left: 8px; font: 500 11.5px var(--f-mono); letter-spacing: .04em; padding: 3px 8px;
  border-radius: 5px; background: rgb(10 12 20 / .72); color: #fff; backdrop-filter: blur(4px); }
.star { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgb(10 12 20 / .55); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.card:hover .star, .star[aria-pressed="true"], .star:focus-visible { opacity: 1; }
.star[aria-pressed="true"] { color: var(--star); }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.body a.t { color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.dom { font: 400 11.5px var(--f-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; position: relative; z-index: 1; }
.tag { font-size: 11.5px; border: 0; background: var(--surface-2); color: var(--muted); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
.tag:hover { color: var(--accent); background: var(--accent-soft); }

/* list density */
.grid.list { grid-template-columns: 1fr; gap: 8px; }
.grid.list .card { flex-direction: row; align-items: center; }
.grid.list .thumb { width: 120px; flex: none; aspect-ratio: 16/10; }
.grid.list .src, .grid.list .ph span { display: none; }
.grid.list .body { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 14px; }
.grid.list .body a.t { flex: 1 1 320px; -webkit-line-clamp: 2; }
.grid.list .tags { margin-top: 0; }
.grid.list .star { position: static; opacity: 1; background: none; color: var(--muted); flex: none; margin-right: 8px; }
.grid.list .star[aria-pressed="true"] { color: var(--star); }

.health { font: 500 11px var(--f-mono); color: var(--muted); }
.health.dead { color: var(--danger); }
.health a.arc { color: var(--accent); position: relative; z-index: 1; }
.card.is-dead .thumb { filter: grayscale(1); opacity: .5; }
.card.is-dead a.t { text-decoration: line-through; text-decoration-color: var(--danger); color: var(--muted); }
.curate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line);
  position: relative; z-index: 1; font-size: 12px; color: var(--muted); }
.curate span { flex: 1 1 100%; }
.curate button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
.curate button:hover { border-color: var(--accent); color: var(--accent); }
.curate button.rm:hover { border-color: var(--danger); color: var(--danger); }
.when { margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.when-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.when .lbl { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-right: 4px; }
.when .chip { font-size: 12.5px; padding: 3px 11px; }
.when .sel { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
.when select { height: 30px; font-size: 13px; }
.when select.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.linkbtn { all: unset; cursor: pointer; font-size: 12.5px; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; margin-left: 6px; }
.when .hint { font-size: 12px; color: var(--muted); margin-left: 4px; }
.cat .ct { display: none; }
.adm .cat .ct { display: inline; }
#meta:empty { display: none; }
.hist { display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); gap: 3px; height: 64px; max-width: 640px; }
.hist button { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 3px; min-width: 0; }
.hist i { display: block; background: color-mix(in srgb, var(--accent) 35%, var(--surface-2)); border-radius: 3px 3px 0 0; transition: background .15s; }
.hist button:hover i { background: color-mix(in srgb, var(--accent) 65%, var(--surface-2)); }
.hist button.on i { background: var(--accent); }
.hist span { font: 400 10px var(--f-mono); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.hist button.on span { color: var(--accent); font-weight: 500; }
.pd { color: var(--fg); font-variant-numeric: tabular-nums; }
.new { font: 600 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.ds { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.alt { font-size: 12px; color: var(--muted); position: relative; z-index: 1; }
.alt a { color: var(--accent); text-decoration: none; }
.alt a:hover { text-decoration: underline; }
.grid.list .ds { flex: 1 1 100%; -webkit-line-clamp: 1; }
.pl { font: 500 10px var(--f-mono); letter-spacing: .04em; border: 1px solid var(--line); color: var(--fg); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.pl-urp { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); color: var(--accent); }
.pl-hdrp { border-color: color-mix(in srgb, var(--star) 60%, var(--line)); color: var(--star); }
/* sidebar filter + collapsible groups */
.browsing { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; margin-bottom: 14px; border-radius: 10px;
  background: var(--accent-soft); }
.browsing .lbl { flex: 1 1 100%; font: 500 10px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.browsing button { border: 0; background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center; max-width: 100%; }
.browsing button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browsing button.view { font-weight: 600; }
.browsing button::after { content: "✕"; font-size: 10px; color: var(--muted); }
.browsing button:hover::after { color: var(--danger); }
.browsing .clear { background: none; color: var(--accent); padding: 3px 4px; }
.browsing .clear::after { content: none; }
.libnav { display: flex; flex-direction: column; margin-bottom: 14px; }
.libnav .adm { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.libnav .adm::before { content: "Admin · only on your machine"; display: block; font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 4px 10px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); margin-bottom: 10px; }
.tabs button { border: 0; background: none; border-radius: 8px; padding: 6px 0; font: 600 13px var(--f-body); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.railtools { display: flex; gap: 6px; margin-bottom: 12px; }
.railtools .railq { margin-bottom: 0; flex: 1; min-width: 0; }
.railtools select { height: 34px; flex: none; }
.av { object-fit: cover; background: var(--surface-2); }
.av { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 9.5px var(--f-body); color: #fff; letter-spacing: .02em; }
.cat .sub { display: block; font: 400 10.5px var(--f-mono); color: var(--muted); }
.cat .nm2 { flex: 1; min-width: 0; overflow: hidden; }
.cat .nm2 .nm { display: block; }
.cat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.pathbtn .lv { display: block; font: 400 10.5px var(--f-mono); color: var(--muted); }
.chead { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: start; margin: -4px 0 18px; max-width: 860px; }
.chead .big { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font: 800 22px var(--f-display); color: #fff; }
.chead p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; }
.chead .meta2 { font: 400 12px var(--f-mono); color: var(--muted); margin-bottom: 10px; }
.socials { display: flex; flex-wrap: wrap; gap: 6px; }
.socials { gap: 8px; }
.socials a.soc { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 4px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13.5px; font-weight: 600; transition: border-color .15s, transform .15s; }
.socials a.soc:hover { border-color: var(--brand); transform: translateY(-1px); }
.socials .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; flex: none; }
.socials .ic svg { width: 15px; height: 15px; fill: currentColor; }
.socials a.soc[style*="var(--fg)"] .ic { color: var(--bg); }
.pcreator .socials a.soc { padding: 0; height: auto; border: 0; background: none; }
.pcreator .socials .ic { width: 26px; height: 26px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pcreator { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.pcreator button { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; }
.railtools select { max-width: 46%; }
.railq { width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 0 10px; font: 500 13px var(--f-body); margin-bottom: 14px; }
.railq:focus { outline: none; border-color: var(--accent); }
.rail-group h3 button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 100%; }
.rail-group h3 button::after { content: "▾"; font-size: 10px; margin-left: auto; margin-right: 8px; transition: transform .15s; }
.rail-group.collapsed h3 button::after { transform: rotate(-90deg); }
.rail-group.collapsed .cat { display: none; }
.rail-group.filtering .cat { display: flex; }
.cat.empty-cat { display: none; }
/* card opens the preview panel */
.card { cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* preview panel */
.scrim { position: fixed; inset: 0; background: rgb(8 10 16 / .45); z-index: 30; opacity: 0; transition: opacity .22s ease; }
.scrim.open { opacity: 1; }
.panel { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--bg); border-left: 1px solid var(--line);
  box-shadow: var(--shadow); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 22px calc(30px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px; transform: translateX(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.panel.open { transform: none; }
.panel.open > * { animation: rise .32s cubic-bezier(.2, .8, .2, 1) backwards; }
.panel.open > :nth-child(2) { animation-delay: .04s; } .panel.open > :nth-child(3) { animation-delay: .08s; } .panel.open > :nth-child(n+4) { animation-delay: .12s; }
.panel > * { flex-shrink: 0; }
.panel .ptop { display: flex; gap: 8px; align-items: center; }
.panel .ptop .sp { flex: 1; }
.panel .pbtn { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; text-decoration: none; color: var(--fg); }
.panel .pbtn:hover { border-color: var(--accent); }
.panel .pbtn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.panel .pbtn[aria-pressed="true"] { color: var(--star); }
.pactions { display: flex; gap: 8px; align-items: center; }
.pactions .pbtn { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.rdetail .pactions { margin: 4px 0 10px; }
.pmedia { border-radius: var(--r); overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 9; max-width: 100%; position: relative; }
.pmedia img, .pmedia iframe { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.panel h2 { font: 800 24px/1.15 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.panel .pds { margin: 0; font-size: 15px; line-height: 1.55; }
.panel .pmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 12px var(--f-mono); color: var(--muted); }
.panel .pmeta b { color: var(--fg); font-weight: 500; }
.panel h4 { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 6px 0 0; }
.panel .tags { margin-top: 0; }
.rel { display: flex; flex-direction: column; gap: 2px; }
.rel button { all: unset; cursor: pointer; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px; border-radius: 8px; }
.rel button:hover, .rel button:focus-visible { background: var(--surface-2); }
.rel .rt { width: 72px; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--surface-2); position: relative; }
.rel .rt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rel .rt .ph span { display: none; }
.rel b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inpath { font-size: 13px; color: var(--muted); }
.inpath a { color: var(--accent); cursor: pointer; }
/* learning paths */
.repos { display: flex; flex-direction: column; gap: 14px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rtools .sel { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
.rtools .lbl { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.rtools select { height: 30px; font-size: 13px; }
.abanner { background: var(--surface-2); width: calc(100% + 32px); margin: -16px -16px 4px; aspect-ratio: 16 / 9; object-fit: cover; background: var(--surface-2); display: block; border-radius: var(--r) var(--r) 0 0; }
.rb.aff { color: var(--star); border-color: currentColor; }
.anote { font-size: 12.5px; color: var(--muted); margin: 0; }
.tgroup h2 { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 14px 0 8px; }
.ttiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); }
.ttile { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-weight: 600; font-size: 14.5px; }
.ttile:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: var(--shadow); }
.ttile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tjump { position: sticky; top: 65px; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin: 0 0 4px; background: linear-gradient(var(--bg) 82%, transparent); scrollbar-width: none; }
.tjump button { flex: none; border: 1px solid color-mix(in srgb, hsl(var(--h) 70% 60%) 40%, var(--line)); background: color-mix(in srgb, hsl(var(--h) 70% 60%) 10%, var(--surface)); color: var(--fg); border-radius: 999px; padding: 5px 13px; font: 600 13px var(--f-body); cursor: pointer; transition: transform .15s, border-color .15s; }
.tjump button:hover { transform: translateY(-1px); border-color: hsl(var(--h) 70% 62%); }
.tgroup { scroll-margin-top: 130px; margin-bottom: 30px; }
.tghead { display: flex; align-items: center; gap: 12px; margin: 6px 0 12px; }
.tgi { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: hsl(var(--h) 75% 66%); background: hsl(var(--h) 70% 60% / .14); flex: none; }
.tgi svg { width: 22px; height: 22px; }
.tghead h2 { font: 800 19px var(--f-display); text-transform: none; letter-spacing: -.01em; color: var(--fg); margin: 0; }
.tghead p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.tgc { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.ttiles { grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 16px; }
#topicsPage { max-width: 1480px; }
#topicsPage .tspot { height: 280px; }
#topicsPage .tspot .himg { height: 100%; width: auto; max-width: 100%; aspect-ratio: 16 / 10; }
.ttile { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: transform .18s, border-color .18s, box-shadow .18s; }
.ttile:hover { transform: translateY(-3px); border-color: hsl(var(--h) 70% 62% / .7); box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.ttile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tcover { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface-2); }
.tcover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.tcover .ph { padding: 0; } .tcover .ph span { display: none; }
.ttile:hover .tcover img { transform: scale(1.06); }
.tcover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 38%, rgb(8 10 18 / .88)); }
.tcap { position: absolute; left: 12px; right: 12px; bottom: 9px; z-index: 1; display: flex; flex-direction: column; gap: 2px; color: #fff; }
.tcap small { font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: rgb(255 255 255 / .7); }
.tcap b { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ttile .thead { display: flex; align-items: center; gap: 10px; padding: 11px 14px 12px; font-weight: 700; }
.ttile .tic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none; color: hsl(var(--h) 75% 66%); background: hsl(var(--h) 70% 60% / .14); }
.ttile .tnm { flex: 1; min-width: 0; font-size: 15px; line-height: 1.25; }
.ttile .tct { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--f-mono); color: var(--muted); }
.ttile .tnew { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.ttile .em { font-size: 20px; }
.ccard { all: unset; cursor: pointer; display: flex; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ccard:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: var(--shadow); }
.ccard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ccard .av { width: 48px; height: 48px; font-size: 18px; flex: none; }
.ccard h3 { margin: 0 0 2px; font-size: 16px; }
.ccard p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

@keyframes m-sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

          <div class="hbtns"><button class="hgo" data-rel="${o.id}">Preview</button><a class="hopen" href="${esc(o.u)}" target="_blank" rel="noopener">Open ↗</a></div></div>
        <img class="himg" src="${esc(o.i)}" alt="" referrerpolicy="no-referrer" onerror="this.closest('.hslide').classList.add('noimg')"></article>`).join('')}
      <button class="hnav prev" aria-label="Previous">‹</button><button class="hnav next" aria-label="Next">›</button>
      <div class="hdots">${picked.map((_, n) => `<button aria-label="Slide ${n + 1}"${n === 0 ? ' class="on"' : ''}></button>`).join('')}</div></div>`;
    const box = heroEl.querySelector('.hbanner'), slides = [...box.querySelectorAll('.hslide')], dots = [...box.querySelectorAll('.hdots button')];
    const show = n => { heroIdx = (n + slides.length) % slides.length; slides.forEach((x, k) => { x.classList.toggle('on', k === heroIdx); x.setAttribute('aria-hidden', String(k !== heroIdx)); }); dots.forEach((d, k) => d.classList.toggle('on', k === heroIdx)); };
    const play = () => { clearInterval(heroT); if (!REDUCED.matches) heroT = setInterval(() => { if (!document.hidden) show(heroIdx + 1); }, 7000); };
    box.querySelector('.prev').onclick = () => { show(heroIdx - 1); play(); }; box.querySelector('.next').onclick = () => { show(heroIdx + 1); play(); };
    dots.forEach((d, k) => d.onclick = () => { show(k); play(); });
    box.onmouseenter = () => clearInterval(heroT); box.onmouseleave = play; box.onfocusin = () => clearInterval(heroT); box.onfocusout = play;
    let x0 = null; box.addEventListener('pointerdown', e => { x0 = e.clientX; }); box.addEventListener('pointerup', e => { if (x0 != null && Math.abs(e.clientX - x0) > 50) { show(heroIdx + (e.clientX < x0 ? 1 : -1)); play(); } x0 = null; });
    play();
  }
  window.__renderHero = renderHero;

  // theme toggle: circular reveal from the button
  $('#themeBtn').addEventListener('click', e => {
    if (!document.startViewTransition || REDUCED.matches) return;
    const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    // the plain toggle above already ran; undo and replay it inside a transition for the reveal
    const root = document.documentElement, now = root.dataset.theme, prev = now === 'dark' ? 'light' : 'dark';
    root.dataset.theme = prev;
    root.classList.add('theme-vt');
    const t = document.startViewTransition(() => { root.dataset.theme = now; });
    t.ready.then(() => root.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] }, { duration: 450, easing: 'ease-out', pseudoElement: '::view-transition-new(root)' }));
    t.finished.finally(() => root.classList.remove('theme-vt'));
  });

  new IntersectionObserver(es => { if (es[0].isIntersecting) more(); }, { rootMargin: '800px' }).observe($('#sentinel'));

  readHash();
  render();

  // ---------- mascot: an octopus whose eyes follow the pointer and who reacts to the site ----------
  (() => {
    const m = $('#mascot'), pups = $('#mPups'), lean = $('#mLean'), tog = $('#mascotToggle'), panelEl = $('#panel'), qEl = $('#q');
    let on = store.get('mascot', 'on') !== 'off', idleT, last = { x: innerWidth, y: 0 }, raf = 0, busy, cur = null, curT, gapUntil = 0, ready = false;
    const lastAt = {}, clicks = [], ss = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: k => { try { sessionStorage.setItem(k, '1'); } catch {} } };
    const say = (cls, ms) => { m.classList.remove('hop', 'sad', 'happy'); void m.offsetWidth; m.classList.add(cls); clearTimeout(busy); busy = setTimeout(() => m.classList.remove(cls), ms); };
    const clear = () => { if (cur) m.classList.remove('r-' + cur); cur = null; clearTimeout(curT); gapUntil = Date.now() + 1500; };
    // a short reaction: one at a time, never twice within 10 s unless forced
    const act = (name, ms, force) => {
      if (!on || REDUCED.matches) return false;
      const now = Date.now();
      if (!force && (cur || now < gapUntil || now - (lastAt[name] || 0) < 10000)) return false;
      clear(); cur = name; lastAt[name] = now; m.classList.add('r-' + name); curT = setTimeout(clear, ms); return true;
    };
    const hold = (cls, yes) => m.classList.toggle('r-' + cls, !!yes && on && !REDUCED.matches);
    const aim = () => {
      raf = 0; const r = m.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .4;
      const dx = last.x - cx, dy = last.y - cy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 220);
      pups.style.transform = `translate(${(dx / d * k * 1.1).toFixed(2)}px, ${(dy / d * k * 0.9).toFixed(2)}px)`;
      lean.style.transform = `translate(${(dx / d * k * 1.2).toFixed(2)}px, 0)`;
    };
    const look = (x, y) => { last = { x, y }; if (!raf) raf = requestAnimationFrame(aim); };
    const wake = () => { m.classList.remove('sleep'); clearTimeout(idleT); idleT = setTimeout(() => m.classList.add('sleep'), 45000); };
    const blink = () => { if (on && !m.classList.contains('sleep')) { m.classList.add('blink'); setTimeout(() => m.classList.remove('blink'), 140); } setTimeout(blink, 2500 + Math.random() * 3500); };
    function apply() { m.hidden = !on; if (tog) tog.textContent = on ? 'Hide mascot' : 'Show mascot'; if (on) wake(); }

    addEventListener('pointermove', e => { if (!on || REDUCED.matches) return; wake(); look(e.clientX, e.clientY); }, { passive: true });
    // poking him: hop, then dizzy, then a flip
    m.addEventListener('click', () => {
      wake(); const now = Date.now(); clicks.push(now); while (clicks.length && now - clicks[0] > 3500) clicks.shift();
      if (clicks.length >= 10) { clicks.length = 0; act('flip', 900, true); } else if (clicks.length >= 5) act('dizzy', 1800, true); else say('hop', 600);
    });
    // clicks elsewhere on the page
    let savedBefore = saved.size;
    addEventListener('click', e => {
      if (!on) return;
      const star = e.target.closest('[data-star]');
      if (star) { say(star.getAttribute('aria-pressed') === 'true' ? 'hop' : 'happy', 600); setTimeout(() => { if (saved.size > savedBefore && saved.size % 10 === 0) act('cheer', 1600, true); savedBefore = saved.size; }, 60); return; }
      if (e.target.closest('#toTop')) { say('hop', 600); return; }
      const cs = (e.target.closest('[data-gocat]') || e.target.closest('.pcreator [data-tag]') || e.target.closest('.cat[data-cat]') || e.target.closest('.card .tag[data-tag]') || {}).dataset;
      const slug = cs && (cs.gocat || cs.tag || cs.cat);
      if (slug && catBySlug[slug] && !catBySlug[slug].grp && slug !== 'creators' && slug !== 'youtube') { act('smitten', 2600, true); return; }
      if (e.target.closest('a[target="_blank"]')) act('wave', 1400);
    }, true);
    qEl.addEventListener('focus', () => { if (!on) return; const r = qEl.getBoundingClientRect(); look(r.left + r.width / 2, r.top); });
    let thinkT; qEl.addEventListener('input', () => { hold('think', true); look(innerWidth / 2, 20); clearTimeout(thinkT); thinkT = setTimeout(() => hold('think', false), 900); });
    // side panel: headphones for videos, a magnifier for everything else
    const watchPanel = () => {
      const open = !panelEl.hidden;
      if (!open) { hold('phones', false); hold('mag', false); return; }
      look(innerWidth * .85, 260);
      const vid = !!panelEl.querySelector('iframe, a[href*="youtube.com"], a[href*="youtu.be"]');
      hold('phones', vid); hold('mag', !vid && !!panelEl.querySelector('h2'));
    };
    new MutationObserver(watchPanel).observe(panelEl, { attributes: true, attributeFilter: ['hidden'], childList: true });
    // command palette: he squints at the search
    new MutationObserver(() => { const o = !$('#paletteWrap').hidden; hold('squint', o); if (o) look(innerWidth / 2, 200); }).observe($('#paletteWrap'), { attributes: true, attributeFilter: ['hidden'] });
    // theme: shades in light, a nightcap in dark
    let themeT; new MutationObserver(() => { if (!ready) return; clearTimeout(themeT); themeT = setTimeout(() => act(document.documentElement.dataset.theme === 'light' ? 'shades' : 'cap', 2600, true), 450); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    // content: empty results, dead cards, new items
    new MutationObserver(() => { if (!on) return; if (grid.querySelector('.empty')) say('sad', 1200); else if (grid.querySelector('.card.is-dead')) act('uhoh', 1100); }).observe(grid, { childList: true });
    new MutationObserver(() => { if (on && $('#hero .hbanner') && !ss.get('mascotNew')) { ss.set('mascotNew'); act('sparkle', 2400, true); } }).observe($('#hero'), { childList: true });
    // scrolling: dizzy when it is flung, a wave at the very bottom
    let wy = scrollY, wt = Date.now(), sum = 0, atEnd = false;
    addEventListener('scroll', () => {
      const now = Date.now(); sum += Math.abs(scrollY - wy); wy = scrollY;
      if (now - wt > 1000) { sum = 0; wt = now; } else if (sum > 5000) { sum = 0; act('dizzy', 1600); }
      const end = innerHeight + scrollY >= document.documentElement.scrollHeight - 240 && scrollY > 2500;
      if (end && !atEnd) act('wave', 1500); atEnd = end;
    }, { passive: true });
    // easter egg and time of day
    const KONAMI = 'ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a'; let seq = [];
    addEventListener('keydown', e => { seq.push(e.key.length === 1 ? e.key.toLowerCase() : e.key); seq = seq.slice(-10); if (seq.join() === KONAMI) { seq = []; act('dance', 3200, true); } });
    const hr = new Date().getHours();
    if (hr >= 22 || hr < 5) setTimeout(() => { if (!ss.get('mascotYawn')) { ss.set('mascotYawn'); act('yawn', 2800, true); } }, 20000);
    else if (hr >= 6 && hr < 10) setTimeout(() => { if (!ss.get('mascotCoffee')) { ss.set('mascotCoffee'); act('coffee', 4500, true); } }, 4000);

    tog?.addEventListener('click', e => { e.preventDefault(); on = !on; store.set('mascot', on ? 'on' : 'off'); apply(); });
    apply(); blink(); look(innerWidth, 0); setTimeout(() => { ready = true; }, 1500);
  })();
})();
</script>
</body>
</html>
